# 매일 아침 8시(한국 시간)에 브리핑을 새로 만들어 저장소에 올립니다.
# 저장소에 새 커밋이 올라가면 Vercel 이 자동으로 다시 배포합니다.
name: Daily briefing

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 한국 시간 오전 8:00 (GitHub 사정으로 몇 분~30분 늦을 수 있음)
  workflow_dispatch:        # Actions 탭에서 "Run workflow" 로 바로 실행할 수도 있습니다

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 브리핑 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 키가 없으면 요약 없는 브리핑이 올라가지 않도록 여기서 멈춥니다
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY 가 등록되지 않았습니다. Settings → Secrets and variables → Actions 에서 추가해 주세요."
            exit 1
          fi
          python briefing.py

      - name: 바뀐 내용 올리기
        run: |
          # Vercel 이 배포를 막지 않도록 저장소 주인 이름으로 커밋합니다
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add index.html news.json
          if git diff --cached --quiet; then
            echo "새 기사가 없어 올릴 내용이 없습니다."
          else
            git commit -m "아침 브리핑 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi
